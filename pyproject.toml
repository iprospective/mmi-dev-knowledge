[project]
name = "mmi-dev-knowledge"
version = "0.1.0"
description = "Knowledge transverse generique pour les outils iProspective"
requires-python = ">=3.10"
dependencies = ["PyYAML>=6"]

[project.optional-dependencies]
dev = ["jsonschema>=4"]

[project.scripts]
mmi-kb = "mmi_kb.cli:main"

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
